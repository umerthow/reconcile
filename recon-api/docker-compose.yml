version: '3.8'

services:
  mysql:
    image: mysql:5.7
    container_name: recon-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: recon_db
      MYSQL_USER: recon_user
      MYSQL_PASSWORD: recon_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - recon-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: recon-redis
    ports:
      - "6379:6379"
    networks:
      - recon-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Note: Kafka is assumed to be running externally on localhost:29092
  # If you need to add Kafka to this compose file, uncomment below:
  # zookeeper:
  #   image: confluentinc/cp-zookeeper:7.5.0
  #   container_name: recon-zookeeper
  #   environment:
  #     ZOOKEEPER_CLIENT_PORT: 2181
  #     ZOOKEEPER_TICK_TIME: 2000
  #   networks:
  #     - recon-network

  # kafka:
  #   image: confluentinc/cp-kafka:7.5.0
  #   container_name: recon-kafka
  #   depends_on:
  #     - zookeeper
  #   ports:
  #     - "29092:29092"
  #   environment:
  #     KAFKA_BROKER_ID: 1
  #     KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29092
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #   networks:
  #     - recon-network

  recon-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recon-api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: recon_user
      DB_PASSWORD: recon_pass
      DB_NAME: recon_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: host.docker.internal:29092
      JWT_SECRET: dev-secret-key-change-in-production-min-32-chars
      ENVIRONMENT: development
      LOG_LEVEL: info
    networks:
      - recon-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  recon-worker:
    build:
      context: ../recon-worker
      dockerfile: Dockerfile
    container_name: recon-worker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GO_ENV: development
      LOG_LEVEL: info
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: recon_user
      DB_PASSWORD: recon_pass
      DB_NAME: recon_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: host.docker.internal:29092
      KAFKA_GROUP_ID: recon-worker-group
      KAFKA_SSL_ENABLE: false
      CUSTODY_API_URL: https://api.custody-provider.com
      CUSTODY_API_KEY: mock-custody-api-key
      POLLING_INTERVAL_SEC: 300
      WORKER_CONCURRENCY: 5
      MAX_RETRIES: 3
      RETRY_BACKOFF_SEC: 2
    networks:
      - recon-network
    restart: unless-stopped

networks:
  recon-network:
    driver: bridge

volumes:
  mysql_data:
